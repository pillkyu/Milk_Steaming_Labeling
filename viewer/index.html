<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>홈 스티밍 · 라벨 모아보기</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#23332f;background:#f4f6f3;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,select,input{border:1px solid #cdd7d0;border-radius:9px;padding:10px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#eef5ef}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #499a73;outline-offset:2px}button:disabled{opacity:.55;cursor:wait}header{padding:26px 32px 20px;border-bottom:1px solid #dae1db;background:#fff;display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:25px;margin:0 0 8px;letter-spacing:-.7px}p{margin:6px 0;color:#60716a;line-height:1.6}.actions{display:flex;gap:8px}.primary{background:#245c45;color:white;border-color:#245c45}.primary:hover{background:#1c4937}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);max-width:1600px;margin:auto;min-height:calc(100vh - 125px)}aside{padding:22px 16px;border-right:1px solid #dae1db}.filters{display:grid;gap:10px;margin-bottom:16px}.muted{font-size:13px;color:#6c7d75}.source{display:block;width:100%;text-align:left;margin:7px 0;padding:13px 12px;line-height:1.5}.source[aria-pressed=true]{border-color:#245c45;background:#e5f0e8;box-shadow:inset 3px 0 #245c45}.source strong{display:block;overflow-wrap:anywhere}.source small{display:block;color:#60716a;margin-top:5px}.library{max-height:calc(100vh - 300px);overflow:auto}main{padding:28px;min-width:0}h2{font-size:24px;margin:8px 0 10px;overflow-wrap:anywhere}.badge{display:inline-block;padding:4px 8px;background:#e8eeea;border-radius:5px;margin-right:6px;font-size:12px}.player{background:white;border:1px solid #dbe3dd;border-radius:14px;padding:20px;margin:18px 0}audio{width:100%;margin:15px 0 6px}canvas{display:block;width:100%;height:150px;cursor:crosshair;background:#f9fbf8;border-radius:8px}.transport{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}.transport label{display:flex;gap:6px;align-items:center}.clock{margin-left:auto;font-variant-numeric:tabular-nums}.sectionbar{display:flex;align-items:center;justify-content:space-between;gap:10px}h3{font-size:17px}table{width:100%;border-collapse:collapse;background:white;font-size:14px}th,td{text-align:left;border-bottom:1px solid #e6ebe7;padding:11px 10px}th{background:#edf2ed;font-weight:500}tr.selected{background:#e9f3eb}td button{padding:7px 10px;white-space:nowrap}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}.tablebox{max-height:480px;overflow:auto;border:1px solid #dbe3dd;border-radius:10px}thead{position:sticky;top:0}.time{font-variant-numeric:tabular-nums;white-space:nowrap}details{margin:20px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 inherit;color:#617269}#status{padding:10px 32px;margin:0;background:#edf4ec}#status.error{background:#fff0e9;color:#9b341a}[hidden]{display:none!important}@media(max-width:750px){header{padding:18px;display:block}.actions{margin-top:14px}.layout{display:block}aside{border-right:0;border-bottom:1px solid #dae1db}.library{max-height:210px}.filters{grid-template-columns:1fr 1fr}main{padding:18px}h2{font-size:21px}.statuscol{display:none}.clock{margin-left:0}th,td{padding:9px 7px}}
.filters input,.filters select{min-width:0;width:100%}
</style>
<header><div><h1>홈 스티밍 · 라벨 모아보기</h1><p>과거 녹음과 새 녹음을 한곳에서 듣고 비교하세요.</p></div><div class="actions"><button id="reload">목록 새로고침</button><button id="sync" class="primary">GitHub 최신 자료 받기</button></div></header>
<p id="status" role="status">자료를 불러오고 있습니다.</p>
<div class="layout"><aside><div class="filters"><input id="search" type="search" placeholder="녹음 이름 검색" aria-label="녹음 이름 검색"><select id="label" aria-label="소리 라벨로 찾기"><option value="">모든 소리</option></select></div><p id="count" class="muted"></p><div id="library" class="library" aria-label="전체 녹음 목록"></div></aside>
<main><section id="empty" hidden><h2>해당하는 녹음이 없습니다.</h2><p>검색어나 소리 필터를 바꿔 주세요.</p></section><section id="detail" hidden><div id="badges"></div><h2 id="title"></h2><p id="description"></p>
<div class="player"><canvas id="wave" role="img" aria-label="원음 파형과 라벨 시간축. 구간 목록에서도 재생할 수 있습니다."></canvas><audio id="audio" controls preload="metadata" aria-label="선택한 원음"></audio><div class="transport"><button id="playSegment" class="primary">선택 구간 듣기</button><button id="whole">전체 듣기</button><label><input id="loop" type="checkbox">구간 반복</label><span id="clock" class="clock muted"></span></div><p id="selection" class="muted"></p></div>
<div class="sectionbar"><h3>라벨 구간</h3><span id="segmentCount" class="muted"></span></div><div class="tablebox"><table><thead><tr><th>소리</th><th>원본 시각</th><th class="statuscol">검수 상태</th><th>듣기</th></tr></thead><tbody id="segments"></tbody></table></div>
<details><summary>원본 위치와 메모</summary><pre id="notes"></pre></details><p class="muted">보기 전용입니다. 원본 음원과 라벨은 기존 위치에 보존됩니다. 미검수·사용 제외 자료도 목록에서 확인할 수 있습니다.</p></section></main></div>
<script type="module">
const $=id=>document.getElementById(id),audio=$('audio');let data,labels={},current,selected=-1,stopAt=null;
const time=n=>`${Math.floor(n/60)}:${(n%60).toFixed(2).padStart(5,'0')}`;
const displayLabel=e=>e.endSignal==='steam_purge'?'steam_purge':e.label;
const name=e=>labels[displayLabel(e)]?.name||displayLabel(e);
const color=e=>labels[displayLabel(e)]?.color||'#a5b3ab';
const matches=e=>!$('label').value||e.label===$('label').value||e.endSignal===$('label').value;
function element(tag,text,className){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(className)el.className=className;return el;}
function status(text,error=false){$('status').textContent=text;$('status').className=error?'error':'';}
async function api(url,options){const response=await fetch(url,options),value=await response.json();if(!response.ok)throw Error(value.error||'불러오기 실패');return value;}
async function load(){
 data=await api('/api/library');labels=Object.fromEntries([...data.labels.classes,...data.labels.annotationOnly].map(l=>[l.id,l]));
 const filter=$('label').value;$('label').replaceChildren(new Option('모든 소리',''));
 for(const l of [...data.labels.classes,...data.labels.annotationOnly.filter(l=>['steam_purge','unknown','exclude'].includes(l.id))])$('label').add(new Option(l.name,l.id));
 $('label').value=filter;const before=current?.id;current=null;renderList(before);
 const legacy=data.files.filter(f=>f.origin==='과거 로컬').length;
 status(`전체 ${data.files.length}개 원본 · 과거 ${legacy}개 + GitHub ${data.files.length-legacy}개 · GitHub 버전 ${data.commit}`);
}
function renderList(preferred=current?.id){
 const term=$('search').value.normalize('NFC').trim().toLowerCase();
 const files=data.files.filter(f=>f.title.toLowerCase().includes(term)&&(!$('label').value||f.segments.some(matches)));
 $('count').textContent=`${files.length}개 녹음`;$('library').replaceChildren();
 for(const f of files){const button=element('button',undefined,'source');button.dataset.id=f.id;button.append(element('strong',f.title),element('small',`${f.origin} · ${time(f.duration)} · ${f.status}`));button.onclick=()=>choose(f);$('library').append(button);}
 $('empty').hidden=files.length>0;$('detail').hidden=!files.length;
 if(!files.length){audio.pause();current=null;stopAt=null;return;}
 choose(files.find(f=>f.id===preferred)||files[0]);
}
function choose(f){
 audio.pause();stopAt=null;current=f;selected=f.segments.findIndex(matches);audio.src=f.audio;
 history.replaceState(null,'','#'+encodeURIComponent(f.id));
 for(const button of $('library').children)button.setAttribute('aria-pressed',String(button.dataset.id===f.id));
 $('title').textContent=f.title;$('badges').replaceChildren(element('span',f.origin,'badge'),element('span',f.status,'badge'));
 $('description').textContent=f.parts>1?`${f.parts}개 절편을 원본 ${time(f.duration)} 시간축에 연결했습니다. 구간별 검수 상태는 유지됩니다.`:`원본 길이 ${time(f.duration)} · 라벨 ${f.segments.length}개`;
 $('notes').textContent=`저장 위치: ${f.location}\n\n${f.note||'메모 없음'}`;renderSegments();selection();draw();
}
function renderSegments(){
 $('segments').replaceChildren();let count=0;
 current.segments.forEach((e,i)=>{if(!matches(e))return;count++;
  const tr=element('tr');tr.dataset.index=i;tr.classList.toggle('selected',i===selected);
  const label=element('td'),dot=element('span',undefined,'dot');dot.style.backgroundColor=color(e);label.append(dot,document.createTextNode(name(e)));
  for(const a of e.airEvents||[])label.append(element('div',`${time(a.start)}–${time(a.end)} · ${a.count===null||a.count===undefined?'횟수 미기록':a.count+'회'} · ${{weak:'약함',medium:'보통',strong:'강함',mixed:'혼합'}[a.strength]||'강도 미기록'}`,'muted'));
  const range=element('td',`${time(e.start)} → ${time(e.end)}`,'time'),state=element('td',e.reviewStatus,'statuscol');
  const action=element('td'),play=element('button','▶ 듣기');play.setAttribute('aria-label',`${name(e)} ${time(e.start)}부터 듣기`);play.onclick=()=>{selected=i;selection();playSegment();};action.append(play);tr.append(label,range,state,action);$('segments').append(tr);
 });$('segmentCount').textContent=`${count}개 구간`;
}
function selection(){const e=current?.segments[selected];$('playSegment').disabled=!e;$('selection').textContent=e?`${name(e)} · ${time(e.start)}–${time(e.end)} · ${(e.end-e.start).toFixed(2)}초 · ${e.reviewStatus}`:'아직 라벨 구간이 없습니다.';for(const row of $('segments').children)row.classList.toggle('selected',Number(row.dataset.index)===selected);draw();}
async function playSegment(){const e=current?.segments[selected];if(!e)return;try{audio.currentTime=e.start;stopAt=e.end;await audio.play();}catch(error){status('재생하지 못했습니다: '+error.message,true);}}
function draw(){
 if(!current)return;const c=$('wave'),rect=c.getBoundingClientRect(),ratio=devicePixelRatio||1;c.width=Math.max(1,rect.width*ratio);c.height=150*ratio;const x=c.getContext('2d');x.scale(ratio,ratio);const w=rect.width;
 const e=current.segments[selected];if(e){x.fillStyle='#dcebe1';x.fillRect(e.start/current.duration*w,0,(e.end-e.start)/current.duration*w,120);}
 const max=Math.max(.000001,...current.waveform.map(v=>Math.abs(v[1])));x.strokeStyle='#5a7866';x.beginPath();for(const [t,a] of current.waveform){const px=t/current.duration*w,h=Math.abs(a)/max*45;x.moveTo(px,58-h);x.lineTo(px,58+h);}x.stroke();
 for(const s of current.segments){x.fillStyle=color(s);x.globalAlpha=s.reviewStatus==='검수 완료'?1:.4;x.fillRect(s.start/current.duration*w,120,Math.max(1,(s.end-s.start)/current.duration*w),20);}x.globalAlpha=1;x.strokeStyle='#163e2b';x.lineWidth=2;x.beginPath();x.moveTo(audio.currentTime/current.duration*w,0);x.lineTo(audio.currentTime/current.duration*w,145);x.stroke();
 $('clock').textContent=`${time(audio.currentTime)} / ${time(current.duration)}`;
}
function tick(){if(!audio.paused&&current){if(stopAt!==null&&audio.currentTime>=stopAt){if($('loop').checked)audio.currentTime=current.segments[selected].start;else{audio.pause();audio.currentTime=stopAt;stopAt=null;}}draw();}requestAnimationFrame(tick);}tick();
$('wave').onclick=event=>{if(!current)return;const rect=$('wave').getBoundingClientRect(),t=Math.max(0,Math.min(current.duration,(event.clientX-rect.left)/rect.width*current.duration));stopAt=null;audio.currentTime=t;const i=current.segments.findIndex(s=>s.start<=t&&t<s.end);if(i>=0)selected=i;selection();};
$('playSegment').onclick=playSegment;$('whole').onclick=async()=>{stopAt=null;try{await audio.play();}catch(e){status(e.message,true);}};
$('search').oninput=()=>renderList();$('label').onchange=()=>renderList();audio.onseeked=draw;audio.onloadedmetadata=draw;
audio.onerror=()=>status('음원을 재생하지 못했습니다. 브라우저가 지원하는 형식인지 확인해 주세요.',true);
audio.onended=()=>{if(stopAt!==null&&$('loop').checked)playSegment();};
window.addEventListener('resize',draw);
$('reload').onclick=()=>load().catch(e=>status(e.message,true));
$('sync').onclick=async()=>{const b=$('sync');b.disabled=true;status('GitHub에서 최신 음원과 라벨을 받는 중입니다…');try{await api('/api/sync',{method:'POST'});await load();}catch(e){status('갱신 실패 · 현재 자료는 유지됩니다. '+e.message,true);}finally{b.disabled=false;}};
try{const id=decodeURIComponent(location.hash.slice(1));await load();if(id){const f=data.files.find(f=>f.id===id);if(f)choose(f);}}catch(e){status(e.message,true);}
</script></html>
